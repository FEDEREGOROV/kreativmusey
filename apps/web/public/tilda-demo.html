<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Демонстрация чата в Tilda</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #101411;
        background: #f5f7f3;
        font-family: Arial, Helvetica, sans-serif;
      }

      .demo-header {
        padding: 32px 24px 28px;
        text-align: center;
        background: #ffffff;
        border-bottom: 1px solid #dfe5dc;
      }

      .demo-header__label {
        margin: 0 0 8px;
        color: #2d6d35;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .demo-header h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 48px);
        line-height: 1.05;
      }

      .demo-header p {
        margin: 12px 0 0;
        color: #69716b;
        font-size: 17px;
      }

      .demo-section {
        width: min(100%, 1488px);
        margin: 0 auto;
        padding: 44px 24px 64px;
      }

      .museum-chat-frame {
        width: 100%;
        margin: 0 auto;
      }

      .museum-chat-frame iframe {
        display: block;
        width: 100%;
        height: 760px;
        border: 0;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 22px 70px rgba(35, 60, 39, 0.12);
      }

      @media (max-width: 640px) {
        .demo-header {
          padding: 24px 18px 22px;
        }

        .demo-section {
          padding: 20px 0 0;
        }

        .museum-chat-frame iframe {
          height: 680px;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="demo-header">
      <p class="demo-header__label">Предпросмотр блока T123</p>
      <h1>Страница на Tilda</h1>
      <p>Ниже показан настоящий чат, встроенный через iframe.</p>
    </header>

    <main class="demo-section">
      <div class="museum-chat-frame">
        <iframe
          src="https://pflstat.ru/embed"
          title="Помощник конкурса «Креативный музей»"
          loading="eager"
          allow="clipboard-write"
        ></iframe>
      </div>
    </main>
  </body>
</html>
